kind = "web"
previewPath = "/"
title = "Solapur Bouncers"
version = "1.0.0"
id = "artifacts/solapur-bouncers"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19366

[services.development]
run = "pnpm --filter @workspace/solapur-bouncers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solapur-bouncers", "run", "build" ]
publicDir = "artifacts/solapur-bouncers/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19366"
BASE_PATH = "/"
